version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app

  dashboard:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install streamlit plotly requests && streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - api